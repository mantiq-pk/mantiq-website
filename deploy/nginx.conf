server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  error_page 404 /404.html;

  location ~ ^/(.+)/$ { return 308 /$1; }

  location / {
    # Clean URLs: /contact -> contact.html; /product/x -> product/x.html
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Content-hashed build assets never change.
  location /_next/static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /404.html { internal; }
}
